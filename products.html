<!DOCTYPE html>
<html>
<head>
  <title>Products</title>

  <style>
    body {
      margin:0;
      font-family: Arial;
      background:#111;
      color:white;
    }

    /* NAV (MATCH HOME PAGE STYLE) */
    nav {
      background:#000;
      padding:10px 40px;
      display:grid;
      grid-template-columns: 1fr auto 1fr;
      align-items:center;
    }

    .left-links,
    .right-links {
      display:flex;
      gap:25px;
      align-items:center;
    }

    .left-links {
      justify-content:flex-end;
    }

    .right-links {
      justify-content:flex-start;
    }

    nav a {
      color:white;
      text-decoration:none;
      font-weight:bold;
      font-size:14px;
    }

    nav a:hover {
      color:#00ffcc;
    }

    .logo {
      display:flex;
      justify-content:center;
      align-items:center;
    }

    .logo img {
      height:110px;
      object-fit:contain;
    }

    /* PRODUCTS SECTION */
    .products {
      padding:80px 20px;
      text-align:center;
    }

    .coming-soon {
      font-size:42px;
      font-weight:900;
      font-style:italic;
      letter-spacing:2px;
      color:#ffffff;
    }

    .subtext {
      margin-top:10px;
      font-size:16px;
      color:#aaa;
    }
  </style>

</head>

<body>

<!-- NAV (UPDATED TO MATCH HOME PAGE) -->
<nav>
  <div class="left-links">
    <a href="index.html">Home</a>
    <a href="products.html">Products</a>
  </div>

  <div class="logo">
    <img src="logo.png" alt="Company Logo">
  </div>

  <div class="right-links">
    <a href="Gallery.html">Gallery</a>
    <a href="booking.html">Book</a>
  </div>
</nav>

<!-- CONTENT -->
<div class="products">
  <div class="coming-soon">COMING SOON...</div>
  <div class="subtext">New flooring products will be available soon.</div>
</div>

</body>
</html>
