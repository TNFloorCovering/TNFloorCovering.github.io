<!DOCTYPE html>
<html>
<head>
  <title>Top Notch Floor Covering</title>

  <style>
    body {
      margin:0;
      font-family: Arial;
      background:#111;
      color:white;

      /* hide default cursor */
      cursor: none;
    }

    /* CUSTOM CURSOR ELEMENT */
    #carpetCursor {
      position: fixed;
      top: 0;
      left: 0;
      width: 40px;
      height: 40px;
      background: url("carpet-cursor.png") no-repeat center/contain;
      pointer-events: none;
      z-index: 9999;

      /* animation feel */
      transform: translate(-50%, -50%) rotate(0deg);
      transition: transform 0.08s linear;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.6));
    }

    /* NAV */
    nav {
      background:#000;
      padding:10px 40px;
      display:grid;
      grid-template-columns: 1fr auto 1fr;
      align-items:center;
    }

    .left-links,
    .right-links {
      display:flex;
      gap:25px;
      align-items:center;
    }

    .left-links { justify-content:flex-end; }
    .right-links { justify-content:flex-start; }

    nav a {
      color:white;
      text-decoration:none;
      font-weight:bold;
      font-size:14px;
    }

    nav a:hover { color:#00ffcc; }

    .logo {
      display:flex;
      justify-content:center;
      align-items:center;
    }

    .logo img {
      height:110px;
      object-fit:contain;
    }

    .hero {
      display:flex;
      justify-content:center;
      align-items:flex-start;
      gap:80px;
      padding:50px 20px 20px;
      flex-wrap:wrap;
      text-align:center;
    }

    .title-block h1 {
      font-size:44px;
      font-weight:900;
      letter-spacing:2px;
      margin-bottom:10px;
    }

    .title-block p {
      font-size:18px;
      margin:5px 0;
      font-weight:500;
    }

    .services {
      text-align:left;
      font-size:14px;
      font-weight:700;
      line-height:30px;
    }

    .services-title {
      font-size:16px;
      margin-bottom:10px;
      color:#00ffcc;
      font-weight:800;
    }

    .gallery {
      padding:40px 20px;
      text-align:center;
      background:#0d0d0d;
    }

    .gallery-grid {
      display:flex;
      flex-wrap:wrap;
      justify-content:center;
      gap:15px;
    }

    .gallery-grid img {
      width:250px;
      height:180px;
      object-fit:cover;
      border-radius:10px;
      cursor:pointer;
      border:2px solid #222;
      transition:0.2s;
    }

    .gallery-grid img:hover {
      transform:scale(1.03);
    }

    .lightbox {
      display:none;
      position:fixed;
      top:0;
      left:0;
      width:100%;
      height:100%;
      background:rgba(0,0,0,0.9);
      justify-content:center;
      align-items:center;
      flex-direction:column;
      z-index:999;
    }

    .lightbox img {
      max-width:80%;
      max-height:80%;
      border-radius:10px;
    }

    .close {
      position:absolute;
      top:20px;
      right:30px;
      font-size:30px;
      cursor:pointer;
      color:white;
    }

    .nav-btn {
      position:absolute;
      top:50%;
      transform:translateY(-50%);
      font-size:40px;
      cursor:pointer;
      color:white;
      user-select:none;
    }

    .prev { left:30px; }
    .next { right:30px; }

    .bottom-link {
      text-align:center;
      padding:30px;
    }

    .bottom-link a {
      color:#00ffcc;
      text-decoration:none;
      font-weight:bold;
      font-size:18px;
    }

  </style>
</head>

<body>

<!-- CUSTOM CURSOR -->
<div id="carpetCursor"></div>

<nav>
  <div class="left-links">
    <a href="index.html">Home</a>
    <a href="products.html">Products</a>
  </div>

  <div class="logo">
    <img src="logo.png" alt="Logo">
  </div>

  <div class="right-links">
    <a href="Gallery.html">Gallery</a>
    <a href="booking.html">Book</a>
  </div>
</nav>

<div class="hero">
  <div class="title-block">
    <h1>TOP NOTCH FLOOR COVERING</h1>
    <p>"The Name Says It All"</p>
    <p>Call (501)-517-0434 for a FREE Quote!</p>
  </div>

  <div class="services">
    <div class="services-title">Our Services</div>
    <span>* Carpet Installation</span><br>
    <span>* Carpet Repair</span><br>
    <span>* Carpet Restretching</span>
  </div>
</div>

<div class="gallery">
  <h2>Some of Our Work</h2>

  <div class="gallery-grid">
    <img src="work1.jpeg">
    <img src="work2.jpeg">
    <img src="work3.jpeg">
    <img src="work4.jpeg">
    <img src="work5.jpeg">
    <img src="work6.jpeg">
  </div>
</div>

<div class="bottom-link">
  <a href="Gallery.html">Gallery</a>
</div>

<script>
  const cursor = document.getElementById("carpetCursor");

  let mouseX = 0;
  let mouseY = 0;

  let cursorX = 0;
  let cursorY = 0;

  document.addEventListener("mousemove", (e) => {
    mouseX = e.clientX;
    mouseY = e.clientY;
  });

  function animateCursor() {
    // smooth follow (lerp effect)
    cursorX += (mouseX - cursorX) * 0.2;
    cursorY += (mouseY - cursorY) * 0.2;

    // subtle tilt based on movement
    let rotate = (mouseX - cursorX) * 0.2;

    cursor.style.transform =
      `translate(${cursorX}px, ${cursorY}px) translate(-50%, -50%) rotate(${rotate}deg)`;

    requestAnimationFrame(animateCursor);
  }

  animateCursor();
</script>

</body>
</html>
