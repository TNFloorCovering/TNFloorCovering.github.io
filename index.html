<!DOCTYPE html>
<html>
<head>
  <title>Top Notch Floor Covering</title>

  <style>
    body {
      margin:0;
      font-family: Arial;
      background:#111;
      color:white;
    }

    /* NAV */
    nav {
      background:#000;
      padding:10px 20px;
      display:flex;
      justify-content:space-between;
      align-items:center;
    }

    nav .left-links,
    nav .right-links {
      display:flex;
      gap:18px;
    }

    nav a {
      color:white;
      text-decoration:none;
      font-weight:bold;
      font-size:14px;
    }

    nav a:hover {
      color:#00ffcc;
    }

    .logo {
      display:flex;
      justify-content:center;
      align-items:center;
    }

    .logo img {
      height:110px;
      object-fit:contain;
    }

    /* HERO */
    .hero {
      text-align:center;
      padding:70px 20px;
    }

    .hero h1 {
      font-size:44px;
      font-weight:900;
      letter-spacing:2px;
      margin-bottom:15px;
    }

    .hero p {
      font-size:18px;
      font-weight:500;
    }

    /* GALLERY */
    .gallery {
      padding:50px 20px;
      text-align:center;
      background:#0d0d0d;
    }

    .gallery h2 {
      margin-bottom:20px;
    }

    .gallery-grid {
      display:flex;
      flex-wrap:wrap;
      justify-content:center;
      gap:15px;
    }

    .gallery-grid img {
      width:250px;
      height:180px;
      object-fit:cover;
      border-radius:10px;
      cursor:pointer;
      border:2px solid #222;
      transition:0.2s;
    }

    .gallery-grid img:hover {
      transform:scale(1.03);
    }

    /* LIGHTBOX */
    .lightbox {
      display:none;
      position:fixed;
      top:0;
      left:0;
      width:100%;
      height:100%;
      background:rgba(0,0,0,0.9);
      justify-content:center;
      align-items:center;
      flex-direction:column;
      z-index:999;
    }

    .lightbox img {
      max-width:80%;
      max-height:80%;
      border-radius:10px;
    }

    .close {
      position:absolute;
      top:20px;
      right:30px;
      font-size:30px;
      cursor:pointer;
      color:white;
    }

    .nav-btn {
      position:absolute;
      top:50%;
      transform:translateY(-50%);
      font-size:40px;
      cursor:pointer;
      color:white;
      user-select:none;
    }

    .prev { left:30px; }
    .next { right:30px; }

    /* BOTTOM LINK */
    .bottom-link {
      text-align:center;
      padding:30px;
    }

    .bottom-link a {
      color:#00ffcc;
      text-decoration:none;
      font-weight:bold;
      font-size:18px;
    }
  </style>
</head>

<body>

<nav>
  <div class="left-links">
    <a href="index.html">Home</a>
    <a href="products.html">Products</a>
  </div>

  <div class="logo">
    <img src="logo.png" alt="Company Logo">
  </div>

  <div class="right-links">
    <a href="Gallery.html">Gallery</a>
    <a href="booking.html">Book</a>
  </div>
</nav>

<div class="hero">
  <h1>TOP NOTCH FLOOR COVERING</h1>
  <p>"The name says it all!"
  <p>Call (501)-517-0434 for a FREE Quote!</p>
</div>

<!-- GALLERY -->
<div class="gallery">
  <h2>Some of our Work</h2>

  <div class="gallery-grid">
    <img src="work1.jpeg" onclick="openLightbox(0)">
    <img src="work2.jpeg" onclick="openLightbox(1)">
    <img src="work3.jpeg" onclick="openLightbox(2)">
    <img src="work4.jpeg" onclick="openLightbox(3)">
    <img src="work5.jpeg" onclick="openLightbox(4)">
    <img src="work6.jpeg" onclick="openLightbox(5)">
  </div>
</div>

<!-- LIGHTBOX -->
<div class="lightbox" id="lightbox">
  <span class="close" onclick="closeLightbox()">&times;</span>
  <span class="nav-btn prev" onclick="changeImage(-1)">&#10094;</span>
  <img id="lightbox-img">
  <span class="nav-btn next" onclick="changeImage(1)">&#10095;</span>
</div>

<!-- BOTTOM LINK -->
<div class="bottom-link">
  <a href="Gallery.html">Gallery</a>
</div>

<script>
  const images = [
    "work1.jpeg",
    "work2.jpeg",
    "work3.jpeg",
    "work4.jpeg",
    "work5.jpeg",
    "work6.jpeg",
  ];

  let currentIndex = 0;

  function openLightbox(index) {
    currentIndex = index;
    document.getElementById("lightbox").style.display = "flex";
    document.getElementById("lightbox-img").src = images[currentIndex];
  }

  function closeLightbox() {
    document.getElementById("lightbox").style.display = "none";
  }

  function changeImage(direction) {
    currentIndex += direction;

    if (currentIndex < 0) currentIndex = images.length - 1;
    if (currentIndex >= images.length) currentIndex = 0;

    document.getElementById("lightbox-img").src = images[currentIndex];
  }
</script>

</body>
</html>
