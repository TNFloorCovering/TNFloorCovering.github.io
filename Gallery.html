<!DOCTYPE html>
<html>
<head>
  <title>Gallery</title>

  <style>
    body {
      margin:0;
      font-family: Arial;
      background:#111;
      color:white;
    }

    /* NAV (MATCH HOME PAGE STYLE) */
    nav {
      background:#000;
      padding:10px 40px;
      display:grid;
      grid-template-columns: 1fr auto 1fr;
      align-items:center;
    }

    .left-links,
    .right-links {
      display:flex;
      gap:25px;
      align-items:center;
    }

    .left-links {
      justify-content:flex-end;
    }

    .right-links {
      justify-content:flex-start;
    }

    nav a {
      color:white;
      text-decoration:none;
      font-weight:bold;
      font-size:14px;
    }

    nav a:hover {
      color:#00ffcc;
    }

    .logo {
      display:flex;
      justify-content:center;
      align-items:center;
    }

    .logo img {
      height:110px;
      object-fit:contain;
    }

    h1 {
      text-align:center;
      margin:30px 0;
      letter-spacing:2px;
    }

    /* SLIDESHOW (WIDER + MORE CINEMATIC) */
    .slideshow {
      width:100%;
      height:600px;
      display:flex;
      justify-content:center;
      align-items:center;
      background:#000;
      position:relative;
      overflow:hidden;
    }

    .slideshow img {
      width:98%;
      height:100%;
      object-fit:contain;
      border-radius:12px;
      cursor:zoom-in;
      transition:opacity 0.5s ease;
    }

    .fade-out {
      opacity:0;
    }

    /* ARROWS MAIN */
    .slide-arrow {
      position:absolute;
      top:50%;
      transform:translateY(-50%);
      font-size:50px;
      cursor:pointer;
      user-select:none;
      color:white;
      padding:10px;
      background:rgba(0,0,0,0.4);
      border-radius:10px;
      z-index:2;
    }

    .slide-left { left:15px; }
    .slide-right { right:15px; }

    /* GRID */
    .gallery {
      display:grid;
      grid-template-columns: repeat(5, 1fr);
      gap:10px;
      padding:20px;
    }

    .gallery img {
      width:100%;
      height:160px;
      object-fit:cover;
      border-radius:10px;
      cursor:pointer;
      transition:0.25s ease;
      border:2px solid #222;
    }

    .gallery img:hover {
      transform:scale(1.05);
      box-shadow:0 0 15px #00ffcc55;
    }

    .gallery img.active {
      border:2px solid #aaa;
    }

    /* FULLSCREEN */
    .fullscreen {
      display:none;
      position:fixed;
      top:0;
      left:0;
      width:100%;
      height:100%;
      background:rgba(0,0,0,0.95);
      z-index:1000;
      justify-content:center;
      align-items:center;
    }

    .fullscreen img {
      max-width:95%;
      max-height:90%;
      object-fit:contain;
    }

    .close {
      position:absolute;
      top:20px;
      right:25px;
      font-size:30px;
      cursor:pointer;
      color:white;
      z-index:2000;
      background:rgba(255,255,255,0.12);
      width:45px;
      height:45px;
      display:flex;
      justify-content:center;
      align-items:center;
      border-radius:50%;
    }

    .close:hover {
      background:rgba(255,255,255,0.25);
    }

    /* FULLSCREEN ARROWS */
    .fs-arrow {
      position:absolute;
      top:50%;
      transform:translateY(-50%);
      font-size:60px;
      cursor:pointer;
      color:white;
      padding:10px;
      background:rgba(0,0,0,0.4);
      border-radius:10px;
      user-select:none;
      z-index:1500;
    }

    .fs-left { left:20px; }
    .fs-right { right:20px; }

  </style>
</head>

<body>

<!-- NAV (UPDATED) -->
<nav>
  <div class="left-links">
    <a href="index.html">Home</a>
    <a href="products.html">Products</a>
  </div>

  <div class="logo">
    <img src="logo.png" alt="Company Logo">
  </div>

  <div class="right-links">
    <a href="Gallery.html">Gallery</a>
    <a href="booking.html">Book</a>
  </div>
</nav>

<h1>GALLERY</h1>

<!-- SLIDESHOW -->
<div class="slideshow" id="slideshow">
  <span class="slide-arrow slide-left" onclick="changeSlide(-1)">&#10094;</span>
  <img id="featured-img" onclick="openFullscreen()">
  <span class="slide-arrow slide-right" onclick="changeSlide(1)">&#10095;</span>
</div>

<!-- GRID -->
<div class="gallery">
  <img src="work1.jpeg" onclick="openFullscreen(0)">
  <img src="work2.jpeg" onclick="openFullscreen(1)">
  <img src="work3.jpeg" onclick="openFullscreen(2)">
  <img src="work4.jpeg" onclick="openFullscreen(3)">
  <img src="work5.jpeg" onclick="openFullscreen(4)">
  <img src="work6.jpeg" onclick="openFullscreen(5)">
  <img src="work7.jpeg" onclick="openFullscreen(6)">
  <img src="work8.jpeg" onclick="openFullscreen(7)">
  <img src="work9.jpeg" onclick="openFullscreen(8)">
  <img src="work10.jpeg" onclick="openFullscreen(9)">
  <img src="work11.jpeg" onclick="openFullscreen(10)">
  <img src="work12.jpeg" onclick="openFullscreen(11)">
  <img src="work13.jpeg" onclick="openFullscreen(12)">
</div>

<!-- FULLSCREEN -->
<div class="fullscreen" id="fullscreen">
  <span class="close" onclick="closeFullscreen()">&times;</span>

  <span class="fs-arrow fs-left" onclick="fsChange(-1)">&#10094;</span>
  <img id="full-img">
  <span class="fs-arrow fs-right" onclick="fsChange(1)">&#10095;</span>
</div>

<script>
  const images = [
    "work1.jpeg","work2.jpeg","work3.jpeg","work4.jpeg","work5.jpeg",
    "work6.jpeg","work7.jpeg","work8.jpeg","work9.jpeg","work10.jpeg",
    "work11.jpeg","work12.jpeg","work13.jpeg"
  ];

  let currentIndex = 0;

  const featured = document.getElementById("featured-img");
  const fullImg = document.getElementById("full-img");
  const fullscreen = document.getElementById("fullscreen");
  const galleryImages = document.querySelectorAll(".gallery img");

  featured.src = images[currentIndex];
  highlight();

  function changeSlide(dir) {
    currentIndex += dir;
    if (currentIndex < 0) currentIndex = images.length - 1;
    if (currentIndex >= images.length) currentIndex = 0;
    updateMain();
  }

  function updateMain() {
    featured.classList.add("fade-out");

    setTimeout(() => {
      featured.src = images[currentIndex];
      featured.classList.remove("fade-out");
      highlight();
    }, 200);
  }

  function highlight() {
    galleryImages.forEach(img => img.classList.remove("active"));
    if (galleryImages[currentIndex]) {
      galleryImages[currentIndex].classList.add("active");
    }
  }

  function openFullscreen(index = currentIndex) {
    currentIndex = index;
    fullscreen.style.display = "flex";
    fullImg.src = images[currentIndex];
    highlight();
  }

  function closeFullscreen() {
    fullscreen.style.display = "none";
  }

  function fsChange(dir) {
    currentIndex += dir;
    if (currentIndex < 0) currentIndex = images.length - 1;
    if (currentIndex >= images.length) currentIndex = 0;

    fullImg.src = images[currentIndex];
    featured.src = images[currentIndex];
    highlight();
  }
</script>

</body>
</html>
