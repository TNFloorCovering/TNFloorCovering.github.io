<!DOCTYPE html>
<html>
<head>
  <title>Gallery</title>

  <style>
    body {
      margin:0;
      font-family: Arial;
      background:#111;
      color:white;
    }

    /* NAV */
    nav {
      background:#000;
      padding:15px;
      display:flex;
      justify-content:center;
      gap:30px;
    }

    nav a {
      color:white;
      text-decoration:none;
      font-weight:bold;
    }

    nav a:hover {
      color:#00ffcc;
    }

    h1 {
      text-align:center;
      margin:30px 0;
      letter-spacing:2px;
    }

    /* SLIDESHOW */
    .slideshow {
      width:100%;
      height:500px;
      display:flex;
      justify-content:center;
      align-items:center;
      background:#000;
      position:relative;
      overflow:hidden;
      cursor:zoom-in;
    }

    .slideshow img {
      width:95%;
      height:100%;
      object-fit:contain;
      border-radius:12px;
      opacity:1;
      transition:opacity 0.8s ease;
    }

    /* FADE CLASS */
    .fade-out {
      opacity:0;
    }

    /* ARROWS */
    .slide-arrow {
      position:absolute;
      top:50%;
      transform:translateY(-50%);
      font-size:50px;
      cursor:pointer;
      user-select:none;
      color:white;
      padding:10px;
      background:rgba(0,0,0,0.4);
      border-radius:10px;
    }

    .slide-arrow:hover {
      background:rgba(255,255,255,0.15);
    }

    .slide-left { left:15px; }
    .slide-right { right:15px; }

    /* GRID */
    .gallery {
      display:grid;
      grid-template-columns: repeat(5, 1fr);
      gap:10px;
      padding:20px;
    }

    .gallery img {
      width:100%;
      height:160px;
      object-fit:cover;
      border-radius:10px;
      cursor:pointer;
      transition:0.25s ease;
      border:2px solid #222;
    }

    .gallery img:hover {
      transform:scale(1.05);
      box-shadow:0 0 15px #00ffcc55;
    }

    .gallery img.active {
      border:2px solid #aaa;
    }

    /* FULLSCREEN VIEW (EXPANDABLE SLIDESHOW) */
    .fullscreen {
      display:none;
      position:fixed;
      top:0;
      left:0;
      width:100%;
      height:100%;
      background:rgba(0,0,0,0.95);
      z-index:1000;
      justify-content:center;
      align-items:center;
      flex-direction:column;
    }

    .fullscreen img {
      max-width:95%;
      max-height:90%;
      object-fit:contain;
      border-radius:12px;
    }

    .close {
      position:absolute;
      top:20px;
      right:25px;
      font-size:35px;
      cursor:pointer;
      color:white;
    }

    /* LIGHTBOX */
    .lightbox {
      display:none;
      position:fixed;
      top:0;
      left:0;
      width:100%;
      height:100%;
      background:rgba(0,0,0,0.92);
      justify-content:center;
      align-items:center;
      z-index:999;
    }

    .lightbox img {
      max-width:85%;
      max-height:85%;
      border-radius:12px;
    }

    .nav-btn {
      position:absolute;
      top:50%;
      transform:translateY(-50%);
      font-size:45px;
      cursor:pointer;
      user-select:none;
      color:white;
    }

    .prev { left:25px; }
    .next { right:25px; }

  </style>
</head>

<body>

<nav>
  <a href="index.html">Home</a>
  <a href="products.html">Products</a>
  <a href="Gallery.html">Gallery</a>
  <a href="booking.html">Book</a>
</nav>

<h1>GALLERY</h1>

<!-- SLIDESHOW -->
<div class="slideshow" id="slideshow">
  <span class="slide-arrow slide-left" onclick="changeSlide(-1)">&#10094;</span>

  <img id="featured-img">

  <span class="slide-arrow slide-right" onclick="changeSlide(1)">&#10095;</span>
</div>

<!-- GRID -->
<div class="gallery">
  <img src="work1.jpeg" onclick="openLightbox(0)">
  <img src="work2.jpeg" onclick="openLightbox(1)">
  <img src="work3.jpeg" onclick="openLightbox(2)">
  <img src="work4.jpeg" onclick="openLightbox(3)">
  <img src="work5.jpeg" onclick="openLightbox(4)">
  <img src="work6.jpeg" onclick="openLightbox(5)">
  <img src="work7.jpeg" onclick="openLightbox(6)">
  <img src="work8.jpeg" onclick="openLightbox(7)">
  <img src="work9.jpeg" onclick="openLightbox(8)">
  <img src="work10.jpeg" onclick="openLightbox(9)">
  <img src="work11.jpeg" onclick="openLightbox(10)">
  <img src="work12.jpeg" onclick="openLightbox(11)">
  <img src="work13.jpeg" onclick="openLightbox(12)">
</div>

<!-- FULLSCREEN EXPAND VIEW -->
<div class="fullscreen" id="fullscreen">
  <span class="close" onclick="closeFullscreen()">&times;</span>
  <img id="full-img">
</div>

<!-- LIGHTBOX -->
<div class="lightbox" id="lightbox">
  <span class="nav-btn prev" onclick="changeImage(-1)">&#10094;</span>
  <img id="lightbox-img">
  <span class="nav-btn next" onclick="changeImage(1)">&#10095;</span>
</div>

<script>
  const images = [
    "work1.jpeg","work2.jpeg","work3.jpeg","work4.jpeg","work5.jpeg",
    "work6.jpeg","work7.jpeg","work8.jpeg","work9.jpeg","work10.jpeg",
    "work11.jpeg","work12.jpeg","work13.jpeg"
  ];

  let currentIndex = 0;

  const featured = document.getElementById("featured-img");
  const fullImg = document.getElementById("full-img");
  const galleryImages = document.querySelectorAll(".gallery img");
  const slideshow = document.getElementById("slideshow");

  featured.src = images[currentIndex];
  highlightImage();

  /* AUTO SLIDE */
  setInterval(() => {
    nextSlide();
  }, 5000);

  function fadeChange() {
    featured.classList.add("fade-out");

    setTimeout(() => {
      featured.src = images[currentIndex];
      featured.classList.remove("fade-out");
      highlightImage();
    }, 300);
  }

  function changeSlide(dir) {
    currentIndex += dir;
    if (currentIndex < 0) currentIndex = images.length - 1;
    if (currentIndex >= images.length) currentIndex = 0;
    fadeChange();
  }

  function nextSlide() {
    currentIndex++;
    if (currentIndex >= images.length) currentIndex = 0;
    fadeChange();
  }

  function highlightImage() {
    galleryImages.forEach(img => img.classList.remove("active"));
    if (galleryImages[currentIndex]) {
      galleryImages[currentIndex].classList.add("active");
    }
  }

  function openLightbox(index) {
    currentIndex = index;
    document.getElementById("lightbox").style.display = "flex";
    document.getElementById("lightbox-img").src = images[currentIndex];
    fadeChange();
  }

  /* FULLSCREEN EXPAND */
  slideshow.addEventListener("click", () => {
    document.getElementById("fullscreen").style.display = "flex";
    fullImg.src = images[currentIndex];
  });

  function closeFullscreen() {
    document.getElementById("fullscreen").style.display = "none";
  }

  /* LIGHTBOX NAV */
  function changeImage(dir) {
    currentIndex += dir;

    if (currentIndex < 0) currentIndex = images.length - 1;
    if (currentIndex >= images.length) currentIndex = 0;

    document.getElementById("lightbox-img").src = images[currentIndex];
    fadeChange();
  }

  /* SWIPE SUPPORT (MOBILE) */
  let startX = 0;

  slideshow.addEventListener("touchstart", (e) => {
    startX = e.touches[0].clientX;
  });

  slideshow.addEventListener("touchend", (e) => {
    let endX = e.changedTouches[0].clientX;

    if (startX - endX > 50) {
      changeSlide(1);
    } else if (endX - startX > 50) {
      changeSlide(-1);
    }
  });

</script>

</body>
</html>
