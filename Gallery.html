<!DOCTYPE html>
<html>
<head>
  <title>Gallery</title>

  <style>
    body {
      margin:0;
      font-family: Arial;
      background:#111;
      color:white;
    }

    /* NAV */
    nav {
      background:#000;
      padding:10px 40px;
      display:grid;
      grid-template-columns: 1fr auto 1fr;
      align-items:center;
    }

    .left-links,
    .right-links {
      display:flex;
      gap:25px;
      align-items:center;
    }

    .left-links {
      justify-content:flex-end;
    }

    .right-links {
      justify-content:flex-start;
    }

    nav a {
      color:white;
      text-decoration:none;
      font-weight:bold;
      font-size:14px;
    }

    nav a:hover {
      color:#00ffcc;
    }

    .logo {
      display:flex;
      justify-content:center;
      align-items:center;
    }

    .logo img {
      height:110px;
      object-fit:contain;
    }

    h1 {
      text-align:center;
      margin:30px 0;
      letter-spacing:2px;
    }

    /* SLIDESHOW */
    .slideshow {
      width:100%;
      height:600px;
      display:flex;
      justify-content:center;
      align-items:center;
      background:#000;
      position:relative;
      overflow:hidden;
    }

    .slideshow img {
      width:98%;
      height:100%;
      object-fit:contain;
      border-radius:12px;
      cursor:pointer;
      transition:opacity 0.4s ease;
    }

    .fade-out {
      opacity:0;
    }

    /* MAIN ARROWS */
    .slide-arrow {
      position:absolute;
      top:50%;
      transform:translateY(-50%);
      font-size:50px;
      cursor:pointer;
      user-select:none;
      color:white;
      padding:10px;
      background:rgba(0,0,0,0.4);
      border-radius:10px;
      z-index:2;
    }

    .slide-left { left:15px; }
    .slide-right { right:15px; }

    /* GALLERY GRID */
    .gallery {
      display:grid;
      grid-template-columns: repeat(5, 1fr);
      gap:10px;
      padding:20px;
    }

    .gallery img {
      width:100%;
      height:160px;
      object-fit:cover;
      border-radius:10px;
      cursor:pointer;
      transition:0.25s ease;
      border:3px solid transparent;
      box-sizing:border-box;
    }

    .gallery img:hover {
      transform:scale(1.03);
      box-shadow:0 0 15px #00ffcc55;
    }

    /* ACTIVE IMAGE BORDER */
    .gallery img.active {
      border:3px solid #9a9a9a;
      box-shadow:0 0 12px rgba(255,255,255,0.25);
    }

    /* FULLSCREEN */
    .fullscreen {
      display:none;
      position:fixed;
      top:0;
      left:0;
      width:100%;
      height:100%;
      background:rgba(0,0,0,0.95);
      z-index:1000;
      justify-content:center;
      align-items:center;
    }

    .fullscreen img {
      max-width:95%;
      max-height:90%;
      object-fit:contain;
    }

    .close {
      position:absolute;
      top:20px;
      right:25px;
      font-size:30px;
      cursor:pointer;
      color:white;
      z-index:2000;
      background:rgba(255,255,255,0.12);
      width:45px;
      height:45px;
      display:flex;
      justify-content:center;
      align-items:center;
      border-radius:50%;
    }

    .close:hover {
      background:rgba(255,255,255,0.25);
    }

    /* FULLSCREEN ARROWS */
    .fs-arrow {
      position:absolute;
      top:50%;
      transform:translateY(-50%);
      font-size:60px;
      cursor:pointer;
      color:white;
      padding:10px;
      background:rgba(0,0,0,0.4);
      border-radius:10px;
      user-select:none;
      z-index:1500;
    }

    .fs-left { left:20px; }
    .fs-right { right:20px; }

    /* MOBILE */
    @media(max-width:900px) {
      .gallery {
        grid-template-columns: repeat(2, 1fr);
      }

      .slideshow {
        height:350px;
      }

      .logo img {
        height:80px;
      }
    }
  </style>
</head>

<body>

<!-- NAV -->
<nav>
  <div class="left-links">
    <a href="index.html">Home</a>
    <a href="products.html">Products</a>
  </div>

  <div class="logo">
    <img src="logo.png" alt="Company Logo">
  </div>

  <div class="right-links">
    <a href="Gallery.html">Gallery</a>
    <a href="booking.html">Book</a>
  </div>
</nav>

<h1>GALLERY</h1>

<!-- SLIDESHOW -->
<div class="slideshow">
  <span class="slide-arrow slide-left" onclick="changeSlide(-1)">&#10094;</span>

  <img id="featured-img" onclick="openFullscreen()">

  <span class="slide-arrow slide-right" onclick="changeSlide(1)">&#10095;</span>
</div>

<!-- GRID -->
<div class="gallery">
  <img src="work1.jpeg" onclick="setSlide(0)">
  <img src="work2.jpeg" onclick="setSlide(1)">
  <img src="work3.jpeg" onclick="setSlide(2)">
  <img src="work4.jpeg" onclick="setSlide(3)">
  <img src="work5.jpeg" onclick="setSlide(4)">
  <img src="work6.jpeg" onclick="setSlide(5)">
  <img src="work7.jpeg" onclick="setSlide(6)">
  <img src="work8.jpeg" onclick="setSlide(7)">
  <img src="work9.jpeg" onclick="setSlide(8)">
  <img src="work10.jpeg" onclick="setSlide(9)">
  <img src="work11.jpeg" onclick="setSlide(10)">
  <img src="work12.jpeg" onclick="setSlide(11)">
  <img src="work13.jpeg" onclick="setSlide(12)">
</div>

<!-- FULLSCREEN -->
<div class="fullscreen" id="fullscreen">
  <span class="close" onclick="closeFullscreen()">&times;</span>

  <span class="fs-arrow fs-left" onclick="fsChange(-1)">&#10094;</span>

  <img id="full-img">

  <span class="fs-arrow fs-right" onclick="fsChange(1)">&#10095;</span>
</div>

<script>
  const images = [
    "work1.jpeg",
    "work2.jpeg",
    "work3.jpeg",
    "work4.jpeg",
    "work5.jpeg",
    "work6.jpeg",
    "work7.jpeg",
    "work8.jpeg",
    "work9.jpeg",
    "work10.jpeg",
    "work11.jpeg",
    "work12.jpeg",
    "work13.jpeg"
  ];

  let currentIndex = 0;

  const featured = document.getElementById("featured-img");
  const fullscreen = document.getElementById("fullscreen");
  const fullImg = document.getElementById("full-img");
  const galleryImages = document.querySelectorAll(".gallery img");

  /* INITIAL LOAD */
  updateMain();

  /* AUTO SLIDESHOW */
  setInterval(() => {
    changeSlide(1);
  }, 5000);

  /* CHANGE MAIN SLIDE */
  function changeSlide(direction) {
    currentIndex += direction;

    if (currentIndex < 0) {
      currentIndex = images.length - 1;
    }

    if (currentIndex >= images.length) {
      currentIndex = 0;
    }

    updateMain();
  }

  /* CLICK SMALL IMAGE */
  function setSlide(index) {
    currentIndex = index;
    updateMain();
  }

  /* UPDATE MAIN IMAGE */
  function updateMain() {
    featured.classList.add("fade-out");

    setTimeout(() => {
      featured.src = images[currentIndex];

      featured.classList.remove("fade-out");

      highlightActive();

      /* KEEP FULLSCREEN MATCHED */
      fullImg.src = images[currentIndex];
    }, 200);
  }

  /* ACTIVE GREY BORDER */
  function highlightActive() {
    galleryImages.forEach((img, index) => {
      if (index === currentIndex) {
        img.classList.add("active");
      } else {
        img.classList.remove("active");
      }
    });
  }

  /* OPEN FULLSCREEN */
  function openFullscreen() {
    fullscreen.style.display = "flex";
    fullImg.src = images[currentIndex];
  }

  /* CLOSE FULLSCREEN */
  function closeFullscreen() {
    fullscreen.style.display = "none";
  }

  /* FULLSCREEN CHANGE */
  function fsChange(direction) {
    currentIndex += direction;

    if (currentIndex < 0) {
      currentIndex = images.length - 1;
    }

    if (currentIndex >= images.length) {
      currentIndex = 0;
    }

    fullImg.src = images[currentIndex];

    updateMain();
  }
</script>

</body>
</html>
