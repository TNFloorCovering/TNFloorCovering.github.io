<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TNFC — Support Our Work</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --gold: #C9A84C;
    --gold-light: #E8C97A;
    --gold-dim: #7A6030;
    --cream: #F5EDD8;
    --bg: #0A0A0A;
    --surface: #111111;
    --surface2: #1A1A1A;
    --border: rgba(201,168,76,0.2);
    --text: #E8E0D0;
    --muted: #6B6258;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-weight: 300;
    min-height: 100vh;
    overflow-x: hidden;
  }

  #carpet-canvas {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 0;
    opacity: 0.18;
    pointer-events: none;
  }

  .page {
    position: relative;
    z-index: 1;
    max-width: 640px;
    margin: 0 auto;
    padding: 60px 24px 80px;
  }

  .brand { text-align: center; margin-bottom: 40px; }

  .logo-ring {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 72px; height: 72px;
    border-radius: 50%;
    border: 1.5px solid var(--gold);
    margin-bottom: 16px;
    animation: ring-pulse 4s ease-in-out infinite;
  }

  @keyframes ring-pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(201,168,76,0.3); }
    50% { box-shadow: 0 0 0 12px rgba(201,168,76,0); }
  }

  .logo-text {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 28px;
    letter-spacing: 3px;
    color: var(--gold);
    line-height: 1;
  }

  h1 {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(42px, 10vw, 64px);
    letter-spacing: 4px;
    color: var(--cream);
    line-height: 0.95;
    margin-bottom: 8px;
  }

  .sub {
    font-size: 13px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--gold);
    margin-bottom: 4px;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 2px;
    padding: 24px;
    margin-bottom: 16px;
    position: relative;
    overflow: hidden;
  }

  .card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
    animation: shimmer 3s ease-in-out infinite;
  }

  @keyframes shimmer {
    0%, 100% { opacity: 0.4; transform: scaleX(0.5); }
    50% { opacity: 1; transform: scaleX(1); }
  }

  .section-label {
    font-size: 11px;
    letter-spacing: 2.5px;
    text-transform: uppercase;
    color: var(--gold-dim);
    margin-bottom: 16px;
    display: block;
    text-align: center;
  }

  #kofiEmbed {
    border-radius: 2px;
    overflow: hidden;
  }

  #kofiframe {
    display: block;
    border: none;
    width: 100%;
    background: #f9f9f9;
  }

  .footer-note {
    text-align: center;
    font-size: 12px;
    color: var(--muted);
    margin-top: 24px;
    line-height: 1.7;
    font-style: italic;
  }
</style>
</head>
<body>

<canvas id="carpet-canvas"></canvas>

<div class="page">

  <div class="brand">
    <div class="logo-ring"><span class="logo-text">TNFC</span></div>
    <div class="sub">Top Notch Floor Covering</div>
    <h1>Support<br>Our Crew</h1>
  </div>

  <div class="card">
    <span class="section-label">Support The Work</span>
    <div id="kofiEmbed">
      <iframe id="kofiframe" src="https://ko-fi.com/blackarcdev/?hidefeed=true&widget=true&embed=true&preview=true" style="padding:4px;" height="680" title="blackarcdev"></iframe>
    </div>
  </div>

  <p class="footer-note">TNFC — professional carpet installation and repair.<br>Your generosity keeps our crew equipped and motivated. 🙏</p>
</div>

<script>
/* ---- CARPET CANVAS ---- */
const canvas = document.getElementById('carpet-canvas');
const ctx = canvas.getContext('2d');
let W, H, fibers = [];

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
  fibers = Array.from({ length: Math.floor((W * H) / 3000) }, () => ({
    x: Math.random() * W,
    y: Math.random() * H,
    len: 6 + Math.random() * 18,
    angle: Math.random() * Math.PI * 2,
    wobble: Math.random() * Math.PI * 2,
    wobbleSpeed: 0.01 + Math.random() * 0.02,
    hue: 35 + Math.random() * 20,
    alpha: 0.3 + Math.random() * 0.5,
    drift: (Math.random() - 0.5) * 0.4
  }));
}

function drawFibers() {
  ctx.clearRect(0, 0, W, H);
  for (const f of fibers) {
    f.wobble += f.wobbleSpeed;
    f.angle += f.drift * 0.005;
    const a = f.angle + Math.sin(f.wobble) * 0.15;
    ctx.beginPath();
    ctx.moveTo(f.x, f.y);
    ctx.lineTo(f.x + Math.cos(a) * f.len, f.y + Math.sin(a) * f.len);
    ctx.strokeStyle = `hsla(${f.hue},60%,55%,${f.alpha})`;
    ctx.lineWidth = 0.8;
    ctx.lineCap = 'round';
    ctx.stroke();
    f.y += Math.sin(f.angle) * 0.12;
    f.x += Math.cos(f.angle) * 0.05;
    if (f.x < -20 || f.x > W + 20 || f.y < -20 || f.y > H + 20) {
      f.x = Math.random() * W; f.y = Math.random() * H;
    }
  }
  requestAnimationFrame(drawFibers);
}
window.addEventListener('resize', resize);
resize();
drawFibers();
</script>
</body>
</html>
